version: "3.9"

services:
  dtek-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dtek-service
    restart: unless-stopped
    ports:
      # Host port is configurable; the container always listens on 8081
      - "${HOST_PORT:-8081}:8081"
    environment:
      # Scraper settings: see README "Configuration" for the full list
      - DTEK_LOG_LEVEL=${DTEK_LOG_LEVEL:-INFO}
    # Playwright benefits from larger shared memory for Chromium
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

